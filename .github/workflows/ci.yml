name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy and match the checksum database
        run: |
          go mod tidy -diff
          go mod verify
      - name: Unit tests with the race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  # The PostgreSQL store against a real database: transactions, the partial
  # unique index, SKIP LOCKED and concurrent requests cannot be faked.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quotes
          POSTGRES_USER: quotes
          POSTGRES_PASSWORD: quotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quotes -d quotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://quotes:quotes@localhost:5432/quotes?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -tags integration -race -count=1 ./internal/postgres/...

  # The OpenAPI file is the contract reviewers read in Swagger UI.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the OpenAPI specification
        run: make lint-api

  # The Prometheus config is valid, and the alerts fire when they should.
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the Prometheus config and test the alert rules
        run: make check-alerts

  # GitHub does not render PlantUML, so the README shows SVGs rendered here.
  # On main the job commits SVGs that changed; GITHUB_TOKEN pushes do not
  # start another workflow run, so this cannot loop.
  diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends graphviz
      - name: Render the diagrams
        run: make diagrams
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: docs/diagrams/*.svg
      - name: Commit changed SVGs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/diagrams/*.svg
          if git diff --cached --quiet; then
            echo "Diagrams are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "docs: render diagrams"
          git push

  # Builds the image for Intel/AMD and for Apple Silicon. The Dockerfile
  # cross-compiles, so no emulation is needed; a red job here means the
  # project would not start on one of the platforms.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Third-party images have arm64 builds
        run: |
          for image in postgres:17-alpine apache/kafka:4.2.0 migrate/migrate:v4.19.1 \
              prom/prometheus:v3.15.1 grafana/grafana:13.1.0 ghcr.io/kafbat/kafka-ui:v1.5.0; do
            platforms=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | join(" ")')
            echo "$image: $platforms"
            case " $platforms " in
              *" linux/arm64 "*) ;;
              *) echo "::error::$image has no linux/arm64 build"; exit 1 ;;
            esac
          done

  # Starts the whole stack the way a reviewer would and updates a quote.
  smoke:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      # The fake provider keeps the run deterministic and offline; the real
      # Frankfurter API is checked in a separate step below.
      RATES_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Probe the API
        run: |
          curl --fail --silent --show-error http://localhost:8080/livez
          curl --fail --silent --show-error http://localhost:8080/readyz
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/docs
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/openapi.yaml
      - name: Run the demo, which checks every step of the assignment
        run: docker compose run --rm demo
      - name: Metrics are exported
        run: |
          curl --fail --silent --show-error http://localhost:8080/metrics | grep -E '^quotes_update_requests_total'
          docker compose exec -T api /usr/local/bin/quotes healthcheck
      - name: The real Frankfurter API answers in the format the client expects
        # External service: a failure here is a warning, not a broken build.
        continue-on-error: true
        run: |
          curl --fail --silent --show-error https://api.frankfurter.dev/v2/rate/EUR/MXN | tee /dev/stderr \
            | jq -e '.base == "EUR" and .quote == "MXN" and (.rate | type == "number") and (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))'
      - name: Check the schema
        run: |
          docker compose exec -T postgres psql -U quotes -d quotes -c '\dt'
          docker compose run --rm migrate version
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  server:
    # The public demo setup (compose.server.yaml): only Caddy is published,
    # and the API answers through it over HTTPS.
    runs-on: ubuntu-latest
    needs: [test]
    env:
      COMPOSE_FILE: compose.yaml:compose.server.yaml
      # For localhost Caddy issues a certificate from its own CA.
      DOMAIN: localhost
      RATES_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - name: Generate passwords
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: The API answers through Caddy, internal endpoints do not
        run: |
          for i in $(seq 30); do curl --silent --insecure --output /dev/null https://localhost/livez && break; sleep 1; done
          test "$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' https://localhost/)" = "302 https://localhost/docs"
          curl --fail -sk --output /dev/null https://localhost/docs
          curl --fail -sk https://localhost/readyz
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/metrics)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/docs)" = 308
      - name: Grafana is public, read-only and without the default password
        run: |
          grafana() { curl -sk --resolve grafana.localhost:443:127.0.0.1 "$@"; }
          for i in $(seq 60); do grafana --fail --output /dev/null https://grafana.localhost/api/health && break; sleep 1; done
          grafana --fail https://grafana.localhost/api/search | jq -e 'length > 0'
          test "$(grafana -o /dev/null -w '%{http_code}' -u admin:admin https://grafana.localhost/api/admin/settings)" = 401
          test "$(grafana -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"title":"x"}' https://grafana.localhost/api/folders)" = 403
      - name: Only Caddy is published
        run: |
          for port in 8080 55432 59094 9090 3000; do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "port $port is published, but it must stay inside the Docker network"; exit 1
            fi
          done
      - name: Run the demo
        run: docker compose run --rm demo
      - name: Memory use under the limits
        run: docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
