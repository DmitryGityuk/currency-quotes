# Prometheus for the local stack: `docker compose --profile observability up`.
global:
  # Short intervals so the demo shows changes within seconds; production
  # setups usually scrape every 15-30s.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:8080"]
